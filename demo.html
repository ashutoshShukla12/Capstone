<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .customBtn {
          display: inline-flex;
          align-items: center;
          background-color: #ff6f3c; /* Orange background */
          color: white; /* White text */
          font-family: Arial, sans-serif;
          font-size: 16px;
          font-weight: bold;
          padding: 10px 20px;
          border: none;
          border-radius: 5px;
          text-decoration: none;
          cursor: pointer;
          transition: background-color 0.3s;
        }
    
        .customBtn:hover {
          background-color: #e65c2a; /* Darker orange on hover */
        }
    
        
      </style>
</head>
<body>
    <a href="#" class="customBtn">
        ADOPT A PET
      </a>    
</body>
</html>
